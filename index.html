<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S AI</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
            color: #00e5ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }
        .ui-container {
            text-align: center;
            z-index: 10;
            margin-top: auto;
            margin-bottom: 50px;
        }
        h1 {
            font-size: 2rem;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #00e5ff;
            margin-bottom: 10px;
        }
        #status {
            font-size: 1rem;
            opacity: 0.7;
            margin-bottom: 20px;
            height: 20px;
        }
        #mic-btn {
            background: transparent;
            border: 2px solid #00e5ff;
            color: #00e5ff;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 0 15px #00e5ff;
            transition: all 0.3s;
        }
        #mic-btn.listening {
            background: #00e5ff;
            color: #000;
            box-shadow: 0 0 30px #00e5ff;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <h1>J.A.R.V.I.S</h1>
        <div id="status">SYSTEM ONLINE...</div>
        <button id="mic-btn">🎤</button>
    </div>

    <!-- مكتبة الرسم 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- إعداد الرسم ثلاثي الأبعاد ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.SphereGeometry(1.5, 32, 32);
        const material = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0.3 });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        const rings = [];
        for (let i = 0; i < 3; i++) {
            const ringGeo = new THREE.TorusGeometry(2.5 + (i * 0.5), 0.02, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.random() * Math.PI;
            ring.rotation.y = Math.random() * Math.PI;
            scene.add(ring);
            rings.push(ring);
        }

        camera.position.z = 6;

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.y += 0.005;
            sphere.rotation.x += 0.002;
            rings.forEach((ring, index) => {
                ring.rotation.x += 0.01 * (index + 1);
                ring.rotation.y += 0.005 * (index + 1);
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- منطق الصوت والتفاعل (J.A.R.V.I.S) ---
        const micBtn = document.getElementById('mic-btn');
        const statusDiv = document.getElementById('status');
        
        // دعم المتصفحات للتعرف على الصوت
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA'; // اللغة العربية
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                statusDiv.innerText = "أنا أسمعك الآن...";
            };

            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                statusDiv.innerText = `قلت: ${speechResult}`;
                processCommand(speechResult);
            };

            recognition.onerror = (event) => {
                statusDiv.innerText = "لم أفهم، حاول مرة أخرى.";
                micBtn.classList.remove('listening');
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
            };
        } else {
            statusDiv.innerText = "متصفحك لا يدعم المايكروفون.";
        }

        micBtn.addEventListener('click', () => {
            if (recognition) {
                recognition.start();
            }
        });

        // دالة معالجة الأوامر ورد JARVIS
        function processCommand(command) {
            // هنا نضع العقل المبدئي (سنربطه بملف بايثون لاحقاً)
            let response = "";
            
            if (command.includes("مرحبا") || command.includes("أهلا")) {
                response = "مرحباً بك. أنا جارفيس، مساعدك الذكي. كيف يمكنني خدمتك؟";
            } else if (command.includes("اسمك")) {
                response = "اسمي جارفيس، نظام ذكاء اصطناعي متطور.";
            } else if (command.includes("الحالة")) {
                response = "جميع الأنظمة تعمل بكفاءة عالية.";
            } else {
                response = "لقد سمعتك تقول: " + command + ". لكن عقلي المركزي لا يزال قيد التطوير.";
            }

            speakResponse(response);
        }

        // دالة النطق (الفم)
        function speakResponse(text) {
            statusDiv.innerText = text;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 1.0;
            utterance.pitch = 0.8; // صوت أعمق قليلاً ليشبه جارفيس
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
